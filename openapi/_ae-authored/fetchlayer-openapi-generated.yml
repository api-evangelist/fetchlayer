              status:
                type: string
              price:
                type: object
                properties:
                  amount:
                    type: number
                  currency:
                    type: string
              buyingFormat:
                type: string
              freeShipping:
                type: boolean
        activeCount:
          type: integer
        endedCount:
          type: integer
        notes:
          type: array
          items: {}
    PostTemuTemuidRequest:
      type: object
      properties:
        market:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              goodsId:
